<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISHF Student Portal</title>
<style>
/* ===== ISHF — International School For Health & Fitness =====
   Professional institutional ERP look: maroon chrome, gold student panel,
   cyan card headers, cream top bar, teal action buttons. ===== */
:root{
  --maroon-900:#5e0f18;
  --maroon-800:#7a1623;
  --maroon-700:#8f1d2c;
  --maroon-600:#a82a3a;
  --maroon-50:#fbeef0;
  --gold:#c69a3c;
  --gold-light:#e0bd66;
  --teal:#1f8d8d;
  --teal-dark:#166e6e;
  --teal-soft:#d6efef;
  --teal-ink:#0f5f5f;
  --green-50:#eaf7ef;
  --green-100:#d6efdf;
  --green-800:#178a4c;
  --green-900:#0f5f35;
  --coral-dark:#a93131;
  --cream:#ece2d0;
  --cream-2:#f4ecdc;
  --ink:#2a2f33;
  --muted:#6c7378;
  --line:#e1e5e8;
  --line-2:#d6dade;
  --bg:#eef0f1;
  --card:#ffffff;
  --field:#eef2f4;
  --ok:#178a4c;--warn:#b4790b;--bad:#c43a3a;
  --shadow:0 1px 2px rgba(40,20,25,.05),0 6px 18px rgba(40,20,25,.06);
  --shadow-lg:0 18px 44px rgba(40,20,25,.16);
  --radius:10px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --ease-spring: cubic-bezier(.16,1,.3,1);
  --dur-fast:160ms;
  --dur:320ms;
  --dur-slow:720ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.5;scroll-behavior:smooth}
.hide{display:none !important}
button{font-family:inherit;cursor:pointer;border:none;transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
input,select,textarea{font-family:inherit;font-size:13.5px}
a{color:var(--teal-dark);text-decoration:none;transition:color var(--dur-fast) var(--ease),opacity var(--dur-fast) var(--ease)}
a:hover{text-decoration:underline}
h2,h3,h4{font-weight:700}

/* ---------- LOGIN ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#f3efe7 0%,#e9e1d2 45%,#e2d6c0 100%);background-size:140% 140%;animation:bgDrift 14s ease-in-out infinite alternate}
#loginScreen::before{content:"";position:absolute;inset:0;
  background:
    radial-gradient(900px 500px at 12% 20%, rgba(143,29,44,.10), transparent 60%),
    radial-gradient(900px 500px at 88% 85%, rgba(31,141,141,.12), transparent 60%)}
.login-card{width:100%;max-width:410px;background:var(--card);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;position:relative;z-index:2;border:1px solid rgba(0,0,0,.04);animation:riseIn .72s var(--ease-spring) both}
.login-card .accent{height:5px;background:linear-gradient(90deg,var(--maroon-700),var(--gold),var(--teal))}
.login-top{padding:26px 30px 4px;text-align:center}
.brand-mark{width:64px;height:64px;border-radius:14px;margin:0 auto 12px;background:linear-gradient(135deg,var(--maroon-700),var(--maroon-900));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 8px 18px rgba(122,22,35,.35);position:relative;letter-spacing:.5px}
.brand-mark::after{content:"";position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:7px;background:var(--teal);border:3px solid #fff}
.login-top h1{font-size:18px;color:var(--maroon-800);letter-spacing:.2px}
.login-top p{font-size:11.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.login-body{padding:18px 30px 24px}
.role-tabs{display:flex;gap:6px;margin-bottom:16px;background:#f1f3f4;padding:4px;border-radius:9px}
.role-tabs button{flex:1;padding:9px;border-radius:7px;background:transparent;font-weight:600;color:var(--muted);font-size:13px}
.role-tabs button.active{background:var(--maroon-700);color:#fff;box-shadow:0 2px 6px rgba(122,22,35,.3)}
.field{position:relative;margin-bottom:12px}
.field input{width:100%;padding:12px 42px 12px 14px;border:1px solid var(--line-2);border-radius:8px;background:#fbfcfd;transition:border-color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.field input:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px rgba(31,141,141,.12);transform:translateY(-1px)}
.field .ic{position:absolute;right:1px;top:1px;bottom:1px;width:40px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--maroon-700);border-radius:0 7px 7px 0;font-size:14px}
.captcha-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.captcha-box{font-family:"Courier New",monospace;font-weight:800;font-size:20px;letter-spacing:5px;
  background:repeating-linear-gradient(50deg,#efe9da,#efe9da 5px,#e6ddc8 5px,#e6ddc8 10px);
  padding:8px 14px;border-radius:7px;color:var(--maroon-800);user-select:none;border:1px solid #ddd2b8}
.captcha-row input{flex:1;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px}
.captcha-row input:focus{outline:none;border-color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--teal);color:#fff;padding:11px 16px;border-radius:8px;font-weight:600;font-size:13.5px;white-space:nowrap;box-shadow:0 7px 16px rgba(31,141,141,.12);position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0%,rgba(255,255,255,.22) 42%,transparent 70%);transform:translateX(-120%);transition:transform .58s var(--ease)}
.btn:hover{background:var(--teal-dark);transform:translateY(-2px);box-shadow:0 12px 24px rgba(31,141,141,.20)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.full{width:100%}
.btn.coral{background:var(--maroon-700)}.btn.coral:hover{background:var(--maroon-800)}
.btn.ghost{background:#eef1f2;color:var(--ink);border:1px solid var(--line-2)}.btn.ghost:hover{background:#e4e8ea}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:7px}
.btn.danger{background:var(--bad)}.btn.danger:hover{background:#a93131}
.login-foot{padding:13px 30px;background:#f6f4ef;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;border-top:1px solid #ece6d8}
.login-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.7;background:#f6f8f8;border:1px dashed var(--line-2);border-radius:7px;padding:8px}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:8px 0 12px;font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:12.5px;margin-bottom:6px;min-height:16px;font-weight:500}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh}
.topbar{height:60px;background:linear-gradient(90deg,var(--cream-2),var(--cream));border-bottom:2px solid var(--maroon-700);
  display:flex;align-items:center;padding:0 16px;gap:14px;position:sticky;top:0;z-index:40;box-shadow:0 1px 6px rgba(0,0,0,.05);animation:slideDown .58s var(--ease-spring) both}
.topbar .tb-logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--maroon-700),var(--maroon-900));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;box-shadow:0 3px 8px rgba(122,22,35,.3);transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.topbar .tb-logo:hover{transform:rotate(-4deg) scale(1.06);box-shadow:0 10px 22px rgba(122,22,35,.25)}
.topbar .menu-btn{font-size:20px;background:none;color:var(--maroon-800);padding:6px;display:none}
.topbar .tb-title{font-weight:800;color:var(--maroon-800);font-size:16px;letter-spacing:.2px;line-height:1.1}
.topbar .tb-title small{display:block;font-weight:600;color:#9a7b58;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase}
.topbar .spacer{flex:1}
.role-pill{background:#fff;color:var(--maroon-800);font-weight:800;font-size:10.5px;padding:6px 13px;border-radius:99px;border:1px solid var(--maroon-50);letter-spacing:.5px;box-shadow:var(--shadow)}
.tb-logout{background:var(--maroon-700);color:#fff;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 8px 18px rgba(122,22,35,.16)}
.tb-logout:hover{background:var(--maroon-800)}

.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:250px;background:linear-gradient(180deg,var(--maroon-800),var(--maroon-900));flex-shrink:0;padding-bottom:16px;animation:slideRight .58s var(--ease-spring) both}
.side-user{padding:16px 16px 16px;background:linear-gradient(135deg,var(--gold-light),var(--gold));margin:0;color:#3c2c0a}
.side-user .av{width:54px;height:54px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--maroon-700);margin-bottom:9px;font-size:19px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.7)}
.side-user .av img{width:100%;height:100%;object-fit:cover}
.side-user .nm{font-weight:800;font-size:14px;color:#3c2c0a}
.side-user .sub{font-size:11px;color:#6a5316;font-weight:600;margin-top:1px}
.nav{padding-top:8px}
.nav a{display:flex;align-items:center;gap:11px;padding:11px 16px;color:#f0d9dd;font-size:13px;font-weight:500;border-left:3px solid transparent;cursor:pointer;transition:transform var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.nav a .ni{width:18px;text-align:center;font-size:14px;opacity:.9;transition:transform var(--dur-fast) var(--ease)}
.nav a:hover{background:rgba(255,255,255,.07);text-decoration:none;color:#fff;transform:translateX(4px)}
.nav a:hover .ni{transform:scale(1.14) rotate(-4deg)}
.nav a.active{background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.02));border-left-color:var(--gold);color:#fff;font-weight:700}
.main{flex:1;padding:22px;overflow-x:hidden}
.page-head{margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.page-head h2{font-size:19px;color:var(--maroon-800)}
.page-head p{color:var(--muted);font-size:12.5px;margin-top:3px}

/* cards / grid */
.grid{display:grid;gap:16px}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(40,20,25,.11);border-color:#d7dde0}
.card .ch{padding:12px 16px;background:var(--teal-soft);border-bottom:1px solid #c4e3e3;font-weight:700;color:var(--teal-ink);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px}
.card .cb{padding:18px}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);min-width:110px;font-weight:700}
.kv .v{color:var(--ink);font-weight:500}

/* dashboard banner */
.hero{border-radius:var(--radius);padding:24px 28px;color:#fff;overflow:hidden;position:relative;margin-bottom:18px;
  background:linear-gradient(115deg,var(--maroon-900) 0%,var(--maroon-700) 48%,#b23347 100%);box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.05)}
.hero::before{content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.10) 1px, transparent 0);background-size:22px 22px}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(224,189,102,.5),transparent 68%);animation:orbFloat 5.5s ease-in-out infinite alternate}
.hero .eyebrow{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);font-weight:800;position:relative;z-index:2}
.hero h3{font-size:23px;margin:6px 0;position:relative;z-index:2;letter-spacing:.2px}
.hero p{color:#f3dde1;max-width:580px;position:relative;z-index:2;font-size:13.5px}
.hero .chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:2}
.hero .chips span{background:rgba(255,255,255,.16);padding:6px 13px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.18);transition:transform var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.hero .chips span:hover{transform:translateY(-2px);background:rgba(255,255,255,.24)}

.profile-photo{width:130px;height:155px;border-radius:8px;object-fit:cover;border:1px solid var(--line-2);background:#eef2f4}
.field-block{margin-bottom:14px}
.field-block label{display:block;font-size:11px;font-weight:800;color:var(--maroon-800);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field-block .ro{padding:10px 12px;background:var(--field);border:1px solid var(--line-2);border-radius:7px;color:var(--ink);min-height:38px}
.field-block input,.field-block select,.field-block textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:7px;background:#fff;color:var(--ink)}
.field-block input:focus,.field-block select:focus,.field-block textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,141,141,.1)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--maroon-50);color:var(--maroon-800);text-align:left;padding:11px 12px;font-weight:700;border-bottom:2px solid #f0d6da;white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{transition:background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
tbody tr:hover{background:#fafbfb;transform:translateX(2px)}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.2px;transition:transform var(--dur-fast) var(--ease)}
.badge:hover{transform:translateY(-1px)}
.badge.ok{background:#e2f5ea;color:var(--ok)}
.badge.warn{background:#fcf2dc;color:#9a6708}
.badge.bad{background:#fbe7e7;color:var(--bad)}
.badge.info{background:var(--teal-soft);color:var(--teal-ink)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{padding:10px 16px;background:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;font-size:13.5px}
.tabs button.active{color:var(--maroon-800);border-bottom-color:var(--maroon-700)}

/* courses */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}
.course-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:var(--shadow);cursor:pointer;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.course-card:hover{transform:translateY(-7px) scale(1.015);box-shadow:0 18px 36px rgba(40,20,25,.16);border-color:#d8dde0}
.course-card .cc-top{height:90px;background:linear-gradient(120deg,var(--maroon-800),var(--maroon-600));color:#fff;padding:14px;position:relative}
.course-card .cc-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--gold);transform-origin:left;transition:transform var(--dur) var(--ease)}
.course-card:hover .cc-top::after{transform:scaleX(.74)}
.course-card .cc-top .code{font-size:11px;opacity:.9;font-weight:700;letter-spacing:.5px}
.course-card .cc-top .tag{position:absolute;top:12px;right:12px;background:var(--teal);font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px}
.course-card .cc-body{padding:14px}
.course-card .cc-body h4{font-size:14.5px;color:var(--maroon-800);margin-bottom:6px;line-height:1.3}
.course-card .cc-body .meta{font-size:11.5px;color:var(--muted)}

/* lecture row */
.lecture{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;background:#fff;transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.lecture:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(40,20,25,.08);border-color:#d6dddd}
.lecture .lic{width:42px;height:42px;border-radius:9px;background:var(--teal-soft);color:var(--teal-ink);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:transform var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.lecture:hover .lic{transform:scale(1.08) rotate(-3deg);background:#c8ecec}
.lecture .lmeta{flex:1}
.lecture .lmeta .lt{font-weight:700;color:var(--maroon-800)}
.lecture .lmeta .ld{font-size:12px;color:var(--muted)}
.lecture .lacts{display:flex;gap:8px;flex-wrap:wrap}

.toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:8px;opacity:.5}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(35,15,20,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px);animation:fadeIn var(--dur) var(--ease) both}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:modalPop .42s var(--ease-spring) both}
.modal .mh{padding:15px 20px;background:var(--maroon-700);color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:700;position:sticky;top:0}
.modal .mh .x{background:none;font-size:22px;color:#fff;line-height:1;opacity:.85}
.modal .mh .x:hover{opacity:1}
.modal .mb{padding:20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}

/* admin */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border-top:3px solid var(--maroon-700)}
.stat .sn{font-size:26px;font-weight:800;color:var(--maroon-800)}
.stat .sl{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.stat .si{font-size:17px;width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.row-acts{display:flex;gap:6px}
.icon-btn{background:var(--teal-soft);color:var(--teal-ink);width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.icon-btn:hover{background:#c4e6e6}
.icon-btn.del{background:#fbe7e7;color:var(--bad)}
.icon-btn.del:hover{background:#f6d6d6}
.section-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.section-actions h3{font-size:15px;color:var(--maroon-800)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--maroon-800);color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;font-size:13.5px;animation:toastIn 2.2s var(--ease-spring) both}

.footer-bar{height:34px;background:linear-gradient(90deg,var(--cream-2),var(--cream));color:#8a6a48;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:11.5px;font-weight:600;border-top:1px solid #e2d8c6}

/* ---------- MOTION SYSTEM ---------- */
.view-enter .page-head,.view-enter .hero,.view-enter .card,.view-enter .stat,.view-enter .course-card,.view-enter .lecture,.view-enter table,.view-enter .toolbar,.view-enter .empty{animation:softReveal .58s var(--ease-spring) both}
.view-enter .hero{animation-delay:.02s}
.view-enter .card:nth-of-type(1),.view-enter .stat:nth-child(1),.view-enter .course-card:nth-child(1),.view-enter .lecture:nth-child(1){animation-delay:.04s}
.view-enter .card:nth-of-type(2),.view-enter .stat:nth-child(2),.view-enter .course-card:nth-child(2),.view-enter .lecture:nth-child(2){animation-delay:.08s}
.view-enter .card:nth-of-type(3),.view-enter .stat:nth-child(3),.view-enter .course-card:nth-child(3),.view-enter .lecture:nth-child(3){animation-delay:.12s}
.view-enter .card:nth-of-type(4),.view-enter .stat:nth-child(4),.view-enter .course-card:nth-child(4),.view-enter .lecture:nth-child(4){animation-delay:.16s}

@keyframes bgDrift{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes riseIn{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
@keyframes softReveal{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalPop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,18px) scale(.96)}12%,82%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,12px) scale(.98)}}
@keyframes orbFloat{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-22px,18px,0) scale(1.08)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important;transition-duration:.01ms !important}
}

@media (max-width:900px){
  .cols-3{grid-template-columns:1fr}.cols-2{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}
  .sidebar{position:fixed;left:-262px;top:60px;bottom:0;z-index:50;transition:.25s;height:calc(100vh - 60px);overflow:auto}
  .sidebar.open{left:0;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
  .topbar .menu-btn{display:inline-flex}
  .main{padding:16px}
}

.brand-mark.has-img::after{display:none}
.brand-mark img,.tb-logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:8px}
.tb-logo.has-img{padding:3px}

<script>
document.getElementById('yr').textContent=new Date().getFullYear();

/* =========================================================
   ISHF PORTAL — data, storage, auth, render
   Persistence: window.storage when available (Claude artifact),
   otherwise an in-memory fallback so it still runs anywhere.
   ========================================================= */

const HAS_STORE = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');
const HAS_LOCAL_STORAGE = (typeof window!=='undefined' && window.localStorage);
const _mem = {};
async function storeGet(k){
  if(HAS_STORE){ try{const r=await window.storage.get(k); return r?r.value:null;}catch(e){return null;} }
  if(HAS_LOCAL_STORAGE){ try{return window.localStorage.getItem(k);}catch(e){} }
  return _mem[k]??null;
}
async function storeSet(k,v){
  if(HAS_STORE){ try{await window.storage.set(k,v);}catch(e){} }
  if(HAS_LOCAL_STORAGE){ try{window.localStorage.setItem(k,v);}catch(e){} }
  _mem[k]=v; return true;
}

let DATA=null;
let SESSION={role:null}; // 'student' | 'staff'
let UI={loginRole:'student', course:null, courseDate:'', adminTab:'dashboard'};

async function loadData(){
  const raw=await storeGet('ishf_data');
  if(raw){ try{DATA=JSON.parse(raw);}catch(e){DATA=defaultData();} }
  else { DATA=defaultData(); await saveData(); }
  DATA=normalizeData(DATA);
  await saveData();
}
async function saveData(){ DATA=normalizeData(DATA); await storeSet('ishf_data', JSON.stringify(DATA)); }

/* ---------- captcha ---------- */
function newCaptcha(){
  const c=Math.floor(1000+Math.random()*9000).toString();
  document.getElementById('captchaText').textContent=c;
  document.getElementById('captchaText').dataset.v=c;
  document.getElementById('captchaInput').value='';
}
function setRole(r){
  UI.loginRole=r;
  document.querySelectorAll('.role-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.role===r));
  document.getElementById('loginUser').placeholder = r==='staff' ? 'Staff ID' : 'Student ID';
  refreshLoginHint();
  document.getElementById('loginErr').textContent='';
}
function refreshLoginHint(){
  const secureHint=document.getElementById('loginHint');
  const secureId=UI.loginRole==='staff' ? DATA.staff.staffId : DATA.student.studentId;
  secureHint.innerHTML=(UI.loginRole==='staff'?'Staff/Admin':'Student')+' ID: <b>'+esc(secureId)+'</b> &middot; password is hidden for security.';
  return;
}
function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const cap=document.getElementById('captchaInput').value.trim();
  const err=document.getElementById('loginErr');
  err.textContent='';
  if(cap!==document.getElementById('captchaText').dataset.v){ err.textContent='Captcha does not match.'; newCaptcha(); return; }
  if(UI.loginRole==='staff'){
    if(u===DATA.staff.staffId && p===DATA.staff.password){ enterApp('staff'); return; }
  }else{
    if(u===DATA.student.studentId && p===DATA.student.password){ enterApp('student'); return; }
  }
  err.textContent='Invalid ID or password. Please try again.'; newCaptcha();
}
function enterApp(role){
  SESSION.role=role;
  document.getElementById('loginScreen').classList.add('hide');
  document.getElementById('app').style.display='block';
  applyBranding();
  if(role==='staff'){ document.getElementById('tbRole').textContent='ADMIN'; renderAdmin(); }
  else{ document.getElementById('tbRole').textContent='STUDENT'; renderStudent('dashboard'); }
  window.scrollTo(0,0);
}
function logout(){
  SESSION.role=null;
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').classList.remove('hide');
  document.getElementById('loginPass').value='';
  newCaptcha(); refreshLoginHint();
}
function applyBranding(){
  document.getElementById('loginName').textContent=DATA.branding.name;
  document.getElementById('loginTag').textContent=DATA.branding.org;
  const lg=safeImageSrc(DATA.branding.logo);
  document.getElementById('loginLogo').innerHTML = lg ? '<img src="'+esc(lg)+'" alt="logo">' : esc(DATA.branding.logoText||'IS');
  document.getElementById('tbLogo').innerHTML    = lg ? '<img src="'+esc(lg)+'" alt="logo">' : esc(DATA.branding.logoText||'IS');
  document.getElementById('loginLogo').classList.toggle('has-img', !!lg);
  document.getElementById('tbLogo').classList.toggle('has-img', !!lg);
  setFavicon(lg);
  document.getElementById('tbBrand').innerHTML=esc(DATA.branding.short)+'<small>'+esc(DATA.branding.centre)+'</small>';
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }
function setFavicon(src){
  src=safeImageSrc(src);
  if(!src) return;
  let l=document.querySelector("link[rel='icon']");
  if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l);}
  l.href=src;
}

/* ---------- helpers ---------- */
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function jsArg(v){return esc(JSON.stringify(String(v??'')));}
function safeUrl(url, fallback){
  const raw=String(url||'').trim();
  const fb=fallback===undefined ? '#' : fallback;
  if(!raw) return fb;
  if(raw==='#') return '#';
  try{
    const u=new URL(raw, window.location.href);
    if(['http:','https:','mailto:','tel:'].includes(u.protocol)) return u.href;
  }catch(e){}
  return fb;
}
function safeImageSrc(src){
  const raw=String(src||'').trim();
  if(/^data:image\/(png|jpe?g|webp|gif);base64,/i.test(raw)) return raw;
  return safeUrl(raw,'');
}
function safeEmbedUrl(url){
  const raw=String(url||'').trim();
  if(!raw) return '';
  const yt=raw.match(/(?:youtu\.be\/|v=)([\w-]{11})/);
  if(yt) return 'https://www.youtube.com/embed/'+yt[1];
  try{
    const u=new URL(raw, window.location.href);
    if(['http:','https:'].includes(u.protocol)) return u.href;
  }catch(e){}
  return '';
}
function normalizeData(input){
  const base=defaultData();
  const merge=(fallback,value)=>{
    if(Array.isArray(fallback)) return Array.isArray(value) ? value : fallback;
    if(fallback && typeof fallback==='object'){
      const out={...fallback};
      if(value && typeof value==='object' && !Array.isArray(value)){
        Object.keys(out).forEach(k=>out[k]=merge(out[k],value[k]));
      }
      return out;
    }
    return value==null ? fallback : value;
  };
  const data=merge(base,input);
  data.branding.logo=safeImageSrc(data.branding.logo);
  data.introVideo.url=safeEmbedUrl(data.introVideo.url);
  ['importantLinks','resources'].forEach(key=>data[key].forEach(x=>x.url=safeUrl(x.url)));
  data.lectures.forEach(x=>{x.rec=safeUrl(x.rec,'');x.pdf=safeUrl(x.pdf,'');});
  return data;
}
function rupee(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function initials(n){return (n||'?').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.getElementById('toastRoot').appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function animateView(){
  const v=document.getElementById('view');
  if(!v) return;
  v.classList.remove('view-enter');
  void v.offsetWidth;
  v.classList.add('view-enter');
}

/* boot */
(async function(){ await loadData(); applyBranding(); newCaptcha(); refreshLoginHint(); })();

function pgCourseDetail(){
  const c=DATA.courses.find(x=>x.code===UI.course)||{code:UI.course,name:''};
  const all=DATA.lectures.filter(l=>l.course===c.code).sort((a,b)=>a.date.localeCompare(b.date));
  const shown = UI.courseDate ? all.filter(l=>l.date===UI.courseDate) : all;
  const lectureHTML = shown.length ? shown.map(l=>{
    const recBtn=l.rec?`<a class="btn sm" href="${esc(safeUrl(l.rec,''))}" target="_blank" rel="noopener noreferrer">▶ Watch Recording</a>`:`<span class="badge warn">Recording soon</span>`;

    return `<div class="lecture"><div class="lic">🎥</div>
      <div class="lmeta"><div class="lt">${esc(l.title)}</div><div class="ld">📅 ${fmtDate(l.date)}</div></div>
      <div class="lacts">${recBtn}${pdfBtn}</div></div>`;
  }).join('') : `<div class="empty"><div class="big">📭</div>No lecture found for the selected date.</div>`;
  return `<div class="page-head"><h2>${esc(c.name)}</h2><p>${esc(c.code)} · ${esc(c.sem||'')}</p></div>
    <div class="toolbar">
      <button class="btn sm ghost" onclick="backToCourses()">← All Courses</button>

      ${UI.courseDate?`<button class="btn sm" onclick="UI.courseDate='';renderStudent('courses')">Clear date</button>`:''}
    </div>
    <div class="card"><div class="ch">Lectures ${UI.courseDate?'· '+fmtDate(UI.courseDate):'(all dates)'}</div><div class="cb">${lectureHTML}</div></div>`;
}
function fmtDate(iso){ if(!iso)return''; const d=new Date(iso+'T00:00'); if(isNaN(d))return iso; return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }

async function raiseTicket(){
  const sub=document.getElementById('tkSub').value.trim();
  const msg=document.getElementById('tkMsg').value.trim();
  if(!sub){toast('Please enter a subject.');return;}
  DATA.tickets.unshift({sub,msg,date:new Date().toLocaleDateString('en-IN'),status:'Open'});
  await saveData(); document.getElementById('tkBody').innerHTML=ticketRows();
  document.getElementById('tkSub').value='';document.getElementById('tkMsg').value='';
  toast('Ticket submitted.');
}
</script>

function fieldInput(id,label,val,type){

  return `<div class="field-block"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val)}"></div>`;
}
function readVal(id){const el=document.getElementById(id);return el?el.value:'';}

async function saveStudent(){
  const ids=['name','studentId','prn','program','batch','email','specialization','admissionDate','abcId','debUnique','address','state','city','pincode','mobile','gender','dob','bloodGroup','mentorName','mentorEmail'];
  ids.forEach(id=>DATA.student[id]=readVal('s_'+id));
  await saveData(); toast('Student details saved.');
}
async function uploadPhoto(inp){
  const f=inp.files[0]; if(!f)return;
  if(!/^image\/(png|jpeg|jpg|webp)$/i.test(f.type) || f.size>1572864){toast('Use PNG/JPG/WebP under 1.5 MB.');return;}
  const rd=new FileReader();
  rd.onload=async()=>{DATA.student.photo=rd.result;await saveData();renderAdmin('student');toast('Photo updated.');};
  rd.readAsDataURL(f);
}
async function clearPhoto(){DATA.student.photo='';await saveData();renderAdmin('student');toast('Photo removed.');}

async function uploadLogo(inp){
  const f=inp.files[0]; if(!f)return;

/* ---- generic collection editor ---- */
function collSection(title,desc,addLabel,onAdd,rows){
  return `<div class="page-head"><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>
    <div class="section-actions"><div></div><button class="btn coral sm" onclick="${onAdd}">+ ${addLabel}</button></div>
    <div class="card"><div class="cb" style="padding:0">${rows}</div></div>`;
}
function actBtns(edit,del){return `<div class="row-acts"><button class="icon-btn" onclick="${edit}">✏️</button><button class="icon-btn del" onclick="${del}">🗑</button></div>`;}

  const c=i>=0?DATA.courses[i]:{code:'',name:'',sem:'Sem 1'};

    fieldInput('c_code','Course Code',c.code)+fieldInput('c_name','Course Name',c.name)+fieldInput('c_sem','Semester',c.sem),

async function delCourse(i){if(confirm('Delete this course?')){DATA.courses.splice(i,1);await saveData();renderAdmin('courses');toast('Deleted.');}}

function adLectures(){
  const cmap={};DATA.courses.forEach(c=>cmap[c.code]=c.name);
  const rows=`<table><thead><tr><th>Course</th><th>Date</th><th>Title</th><th>Rec</th><th>PDF</th><th>Actions</th></tr></thead><tbody>
    ${DATA.lectures.slice().sort((a,b)=>b.date.localeCompare(a.date)).map((l)=>{const i=DATA.lectures.indexOf(l);return `<tr><td>${esc(l.course)}<div style="font-size:11px;color:var(--muted)">${esc(cmap[l.course]||'')}</div></td><td>${fmtDate(l.date)}</td><td>${esc(l.title)}</td><td>${l.rec?'<span class="badge ok">Yes</span>':'<span class="badge bad">No</span>'}</td><td>${l.pdf?'<span class="badge ok">Yes</span>':'<span class="badge bad">No</span>'}</td><td>${actBtns(`editLecture(${i})`,`delLecture(${i})`)}</td></tr>`;}).join('')||'<tr><td colspan="6" class="empty">No lectures.</td></tr>'}
  </tbody></table>`;
  return collSection('Lectures','Students pick a date inside a course to get the recording and PDF added here.','Add Lecture','editLecture(-1)',rows);
}
function editLecture(i){
  const l=i>=0?DATA.lectures[i]:{course:DATA.courses[0]?.code||'',date:'',title:'',rec:'',pdf:''};
  const opts=DATA.courses.map(c=>`<option value="${esc(c.code)}" ${c.code===l.course?'selected':''}>${esc(c.code)} — ${esc(c.name)}</option>`).join('');
  const body=`<div class="field-block"><label>Course</label><select id="l_course">${opts}</select></div>
    ${fieldInput('l_date','Lecture Date',l.date,'date')}
    ${fieldInput('l_title','Lecture Title',l.title)}
    ${fieldInput('l_rec','Recording URL (YouTube / video link)',l.rec)}
    ${fieldInput('l_pdf','PDF / Notes URL',l.pdf)}`;

    const o={course:readVal('l_course'),date:readVal('l_date'),title:readVal('l_title'),rec:readVal('l_rec'),pdf:readVal('l_pdf')};

  const news=`<table><thead><tr><th>Title</th><th>Date</th><th>Body</th><th>Actions</th></tr></thead><tbody>
    ${DATA.news.map((n,i)=>`<tr><td>${esc(n.title)}</td><td>${esc(n.date)}</td><td>${esc(n.body)}</td><td>${actBtns(`editNews(${i})`,`delNews(${i})`)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">None.</td></tr>'}</tbody></table>`;
  const res=`<table><thead><tr><th>Title</th><th>Type</th><th>URL</th><th>Actions</th></tr></thead><tbody>
    ${DATA.resources.map((r,i)=>`<tr><td>${esc(r.title)}</td><td>${esc(r.type)}</td><td style="max-width:160px;overflow:hidden;text-overflow:ellipsis">${esc(r.url)}</td><td>${actBtns(`editRes(${i})`,`delRes(${i})`)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">None.</td></tr>'}</tbody></table>`;
  return `<div class="page-head"><h2>News & Resources</h2></div>
    <div class="section-actions"><h3 style="color:var(--green-900)">News</h3><button class="btn coral sm" onclick="editNews(-1)">+ Add News</button></div>
    <div class="card"><div class="cb" style="padding:0">${news}</div></div>
    <div class="section-actions" style="margin-top:18px"><h3 style="color:var(--green-900)">E-Resources</h3><button class="btn coral sm" onclick="editRes(-1)">+ Add Resource</button></div>
    <div class="card"><div class="cb" style="padding:0">${res}</div></div>`;
}
function editNews(i){const n=i>=0?DATA.news[i]:{title:'',date:new Date().toLocaleDateString('en-IN'),body:''};
  openForm(i>=0?'Edit News':'Add News',fieldInput('n_t','Title',n.title)+fieldInput('n_d','Date',n.date)+fieldInput('n_b','Body',n.body,'textarea'),
  async()=>{const o={title:readVal('n_t'),date:readVal('n_d'),body:readVal('n_b')};if(i>=0)DATA.news[i]=o;else DATA.news.unshift(o);await saveData();renderAdmin('news');toast('Saved.');return true;});}
async function delNews(i){if(confirm('Delete?')){DATA.news.splice(i,1);await saveData();renderAdmin('news');toast('Deleted.');}}
function editRes(i){const r=i>=0?DATA.resources[i]:{title:'',type:'PDF',url:'#'};
  openForm(i>=0?'Edit Resource':'Add Resource',fieldInput('r_t','Title',r.title)+fieldInput('r_ty','Type',r.type)+fieldInput('r_u','URL',r.url),
  async()=>{const o={title:readVal('r_t'),type:readVal('r_ty'),url:readVal('r_u')};if(i>=0)DATA.resources[i]=o;else DATA.resources.push(o);await saveData();renderAdmin('news');toast('Saved.');return true;});}
async function delRes(i){if(confirm('Delete?')){DATA.resources.splice(i,1);await saveData();renderAdmin('news');toast('Deleted.');}}

/* IMPORTANT LINKS */
function adLinks(){
  const rows=`<table><thead><tr><th>Title</th><th>URL</th><th>Actions</th></tr></thead><tbody>
    ${DATA.importantLinks.map((l,i)=>`<tr><td>${esc(l.title)}</td><td>${esc(l.url)}</td><td>${actBtns(`editLink(${i})`,`delLink(${i})`)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">None.</td></tr>'}
  </tbody></table>`;

function editLink(i){const l=i>=0?DATA.importantLinks[i]:{title:'',url:'#'};

  async()=>{const o={title:readVal('lk_t'),url:readVal('lk_u')};if(i>=0)DATA.importantLinks[i]=o;else DATA.importantLinks.push(o);await saveData();renderAdmin('links');toast('Saved.');return true;});}
async function delLink(i){if(confirm('Delete?')){DATA.importantLinks.splice(i,1);await saveData();renderAdmin('links');toast('Deleted.');}}

/* FORM VERIFICATION */
function adVerification(){
  const f=DATA.formVerification;
  const F=(id,l)=>fieldInput('fv_'+id,l,f[id]||'');
  const edu=`<table><thead><tr><th>Degree</th><th>College</th><th>Board</th><th>Pass Year</th><th>Doc</th><th></th></tr></thead><tbody>
    ${f.education.map((e,i)=>`<tr><td>${esc(e.degree)}</td><td>${esc(e.college)}</td><td>${esc(e.board)}</td><td>${esc(e.passYear)}</td><td>${esc(e.docType)}</td><td>${actBtns(`editEdu(${i})`,`delEdu(${i})`)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">None.</td></tr>'}</tbody></table>`;
  const stat=`<table><thead><tr><th>Status</th><th>On</th><th>By</th><th></th></tr></thead><tbody>
    ${f.status.map((e,i)=>`<tr><td>${esc(e.to)}</td><td>${esc(e.on)}</td><td>${esc(e.by)}</td><td>${actBtns(`editStat(${i})`,`delStat(${i})`)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">None.</td></tr>'}</tbody></table>`;
  return `<div class="page-head"><h2>Form Verification</h2></div>
    <div class="card"><div class="ch">Basic verification fields</div><div class="cb"><div class="grid cols-3">
      ${F('registrationDate','Registration Date')}${F('formNo','Form No')}${F('program','Program')}
      ${F('specialization','Specialization')}${F('admissionCategory','Admission Category')}${F('aadhar','Aadhar (masked)')}
      ${F('religion','Religion')}${F('caste','Caste')}${F('category','Category')}
    </div><div style="margin-top:12px"><button class="btn coral sm" onclick="saveFV()">Save Fields</button></div></div></div>
    <div class="section-actions" style="margin-top:16px"><h3 style="color:var(--green-900)">Educational Details</h3><button class="btn coral sm" onclick="editEdu(-1)">+ Add</button></div>
    <div class="card"><div class="cb" style="padding:0">${edu}</div></div>
    <div class="section-actions" style="margin-top:16px"><h3 style="color:var(--green-900)">Status History</h3><button class="btn coral sm" onclick="editStat(-1)">+ Add</button></div>
    <div class="card"><div class="cb" style="padding:0">${stat}</div></div>`;
}
async function saveFV(){['registrationDate','formNo','program','specialization','admissionCategory','aadhar','religion','caste','category'].forEach(id=>DATA.formVerification[id]=readVal('fv_'+id));await saveData();toast('Saved.');}
function editEdu(i){const e=i>=0?DATA.formVerification.education[i]:{degree:'',college:'',board:'',passYear:'',docType:''};
  openForm(i>=0?'Edit Education':'Add Education',fieldInput('ed_d','Degree',e.degree)+fieldInput('ed_c','College',e.college)+fieldInput('ed_b','Board',e.board)+fieldInput('ed_p','Pass Year',e.passYear)+fieldInput('ed_t','Document Type',e.docType),
  async()=>{const o={degree:readVal('ed_d'),college:readVal('ed_c'),board:readVal('ed_b'),passYear:readVal('ed_p'),docType:readVal('ed_t')};if(i>=0)DATA.formVerification.education[i]=o;else DATA.formVerification.education.push(o);await saveData();renderAdmin('verification');toast('Saved.');return true;});}
async function delEdu(i){if(confirm('Delete?')){DATA.formVerification.education.splice(i,1);await saveData();renderAdmin('verification');toast('Deleted.');}}
function editStat(i){const s=i>=0?DATA.formVerification.status[i]:{to:'',on:'',reason:'',by:''};
  openForm(i>=0?'Edit Status':'Add Status',fieldInput('st_t','Status To',s.to)+fieldInput('st_o','Changed On',s.on)+fieldInput('st_r','Reason',s.reason)+fieldInput('st_b','Changed By',s.by),
  async()=>{const o={to:readVal('st_t'),on:readVal('st_o'),reason:readVal('st_r'),by:readVal('st_b')};if(i>=0)DATA.formVerification.status[i]=o;else DATA.formVerification.status.push(o);await saveData();renderAdmin('verification');toast('Saved.');return true;});}
async function delStat(i){if(confirm('Delete?')){DATA.formVerification.status.splice(i,1);await saveData();renderAdmin('verification');toast('Deleted.');}}

/* TICKETS */
function adTickets(){
  const rows=`<table><thead><tr><th>#</th><th>Subject</th><th>Message</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>
    ${DATA.tickets.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.sub)}</td><td>${esc(t.msg)}</td><td>${esc(t.date)}</td><td><span class="badge ${t.status==='Resolved'?'ok':'warn'}">${esc(t.status)}</span></td><td>${t.status!=='Resolved'?`<button class="btn sm" onclick="resolveTicket(${i})">Mark Resolved</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No tickets raised yet.</td></tr>'}
  </tbody></table>`;
  return `<div class="page-head"><h2>Support Tickets</h2></div><div class="card"><div class="cb" style="padding:0">${rows}</div></div>`;
}
async function resolveTicket(i){DATA.tickets[i].status='Resolved';await saveData();renderAdmin('tickets');toast('Ticket resolved.');}

/* ---- modal form helper ---- */
function openForm(title,bodyHtml,onSave){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="mh">${esc(title)}<button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">${bodyHtml}</div>
    <div class="mf"><button class="btn ghost sm" onclick="closeModal()">Cancel</button><button class="btn coral sm" id="modalSave">Save</button></div>
    </div></div>`;
  document.getElementById('modalSave').onclick=async()=>{const ok=await onSave();if(ok!==false)closeModal();};
}

/* ---- export / import / reset ---- */
function exportData(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ishf-portal-data.json';a.click();
  toast('Data exported.');
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  if(f.size>1048576){toast('Import file is too large.');inp.value='';return;}
  rd.onload=async()=>{try{DATA=normalizeData(JSON.parse(rd.result));await saveData();applyBranding();renderAdmin('dashboard');toast('Data imported safely.');}catch(e){toast('Invalid file.');}finally{inp.value='';}};
  rd.readAsText(f);
}
async function resetData(){if(confirm('Reset everything back to sample data?')){DATA=defaultData();await saveData();applyBranding();renderAdmin('dashboard');toast('Reset done.');}}
</script>
