server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index ishf-portal.html index.html;

  charset utf-8;

  location / {
    try_files $uri $uri/ /ishf-portal.html;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-store";
  }

  location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
